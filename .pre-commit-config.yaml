# ==============================================================================
# Panasonic DIGA Commander - Pre-Commit Git Hook Configuration
# ==============================================================================
# Instalação local do ambiente de desenvolvimento:
#   pip install pre-commit
#   pre-commit install
#
# Executar auditoria em todos os arquivos:
#   pre-commit run --all-files
# ==============================================================================

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ----------------------------------------------------------------------------
  # Verificações fundamentais de formatação, espaços e integridade de sintaxe
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-xml
      - id: check-added-large-files
        args: ['--maxkb=25000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ----------------------------------------------------------------------------
  # Auditoria de estilo de código Kotlin / Android via KtLint (Gradle Wrapper)
  # ----------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ktlint-check
        name: KtLint Kotlin Style & Lint Check
        entry: ./gradlew ktlintCheck --daemon
        language: system
        files: \.kt[s]?$
        pass_filenames: false
