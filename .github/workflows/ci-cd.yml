name: Android CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar e publicar GitHub Release manualmente'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write
  actions: read

jobs:
  # ============================================================================
  # Etapa 1: Validação de Qualidade, Pre-Commit, Linter e Testes Unitários
  # ============================================================================
  lint-and-audit:
    name: Pre-Commit, Linter & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 for Pre-Commit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Run Pre-Commit Hooks
        uses: pre-commit/action@v3.0.1

      - name: Run KtLint Code Style Audit
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run Android Lint Audit
        run: ./gradlew lintDebug --stacktrace

      - name: Run JUnit Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  # ============================================================================
  # Etapa 2: Compilação dos APKs (Debug e Release)
  # ============================================================================
  build-apk:
    name: Build & Package APKs
    needs: [lint-and-audit]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Organize & Package APK Artifacts
        id: prepare-artifacts
        run: |
          mkdir -p build-artifacts

          # Extrair versão do build.gradle.kts ou usar a tag
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi
          echo "Detected App Version: $VERSION"
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

          # Release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/Panasonic-DIGA-Commander-release.apk
            cp app/build/outputs/apk/release/app-release.apk "build-artifacts/Panasonic-DIGA-Commander-v${VERSION}-release.apk"
          fi

          # Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/Panasonic-DIGA-Commander-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk "build-artifacts/Panasonic-DIGA-Commander-v${VERSION}-debug.apk"
          fi

          # Gerar Checksums SHA-256 para verificação de integridade
          cd build-artifacts
          sha256sum Panasonic-DIGA-Commander-*.apk > SHA256SUMS.txt
          cd ..

          echo "Prepared Artifacts:"
          ls -lh build-artifacts/
          cat build-artifacts/SHA256SUMS.txt

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Panasonic-DIGA-Commander-APKs
          path: build-artifacts/
          retention-days: 30

  # ============================================================================
  # Etapa 3: Publicação de Release Oficial no GitHub
  # ============================================================================
  release:
    name: Publish GitHub Release
    needs: [build-apk]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Panasonic-DIGA-Commander-APKs
          path: release-artifacts

      - name: Resolve Release Tag & Name
        id: release-info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
            TAG="v${VERSION:-0.1.0}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_title=Release $TAG" >> $GITHUB_OUTPUT
          echo "Target Release: $TAG"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag_name }}
          name: ${{ steps.release-info.outputs.release_title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
