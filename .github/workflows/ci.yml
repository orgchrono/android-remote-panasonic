name: CI - Lint & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Pre-Commit, Linter & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for Pre-Commit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Run Pre-Commit Hooks
        uses: pre-commit/action@v3.0.1

      - name: Run KtLint Code Style Audit
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run Android Lint Audit
        run: ./gradlew lintDebug --stacktrace

      - name: Run JUnit Unit Tests
        run: ./gradlew test --stacktrace

      - name: Verify Debug APK Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
