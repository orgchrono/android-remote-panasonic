name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build, Audit and Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Environment
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Code Quality & Linter Audit (KtLint)
        run: ./gradlew ktlintCheck

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run Android Lint Audit
        run: ./gradlew lintDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-release.apk build-artifacts/Panasonic-DIGA-Commander-release.apk
          echo "APK successfully built and prepared:"
          ls -lh build-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panasonic-DIGA-Commander-APK
          path: build-artifacts/Panasonic-DIGA-Commander-release.apk
          retention-days: 30

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/Panasonic-DIGA-Commander-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
