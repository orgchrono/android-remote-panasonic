name: Release - Build & Publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Publish Official Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x ./gradlew

      - name: Run Tests & Verification
        run: ./gradlew test ktlintCheck --stacktrace

      - name: Build Release and Debug APKs
        run: |
          ./gradlew assembleRelease --stacktrace
          ./gradlew assembleDebug --stacktrace

      - name: Package Release Assets (Single Canonical Files)
        id: package-assets
        run: |
          mkdir -p release-assets

          # Extrair tag ou versão do build.gradle.kts
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
            TAG_NAME="v${VERSION:-0.1.0}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Release APK (Binário de Produção Assinado)
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Panasonic-DIGA-Commander-${TAG_NAME}.apk"

          # Debug APK (Binário de Diagnóstico/Testes)
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Panasonic-DIGA-Commander-${TAG_NAME}-debug.apk"

          # Checksum SHA-256 apenas dos 2 arquivos finais
          cd release-assets
          sha256sum Panasonic-DIGA-Commander-*.apk > SHA256SUMS.txt
          cd ..

          echo "Arquivos finais preparados para o Release (sem duplicatas):"
          ls -lh release-assets/
          echo "--- Checksums ---"
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.package-assets.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
